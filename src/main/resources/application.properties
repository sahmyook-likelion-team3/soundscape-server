spring.application.name=soundscape

# ---------- MySQL ----------
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:soundscape}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:soundscape}
spring.datasource.password=${DB_PASSWORD:soundscape1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# schema.sql / seed.sql 로 직접 관리. JPA 자동 DDL 사용 안 함
# Hibernate 7 은 dialect 를 자동 감지하므로 명시하지 않는다.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# ---------- Multipart (사진 업로드) ----------
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# ---------- HTTP Client (Spring Boot 4 신규 네임스페이스) ----------
# 구 spring.http.client.* 는 deprecated. OpenAI 호출 타임아웃이 여기서 적용된다.
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=20s

# ---------- AWS S3 ----------
aws.s3.bucket=soundscape-bucket-sangjin
aws.s3.region=ap-northeast-2
aws.credentials.access-key=${AWS_ACCESS_KEY:}
aws.credentials.secret-key=${AWS_SECRET_KEY:}
aws.s3.presign-minutes=60

# ---------- OpenAI ----------
openai.api-key=${OPENAI_API_KEY:}
openai.model=gpt-4o
openai.base-url=https://api.openai.com/v1
openai.image-detail=low
openai.image-max-size=512

# ---------- CORS ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ---------- 운영용 관리자 API ----------
admin.api-key=${ADMIN_API_KEY:}

# ---------- 서버 ----------
server.port=8080
java.awt.headless=true
